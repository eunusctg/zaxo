name: zaxo
description: Zaxo - Message & Call Freely. 100% Free Forever.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Navigation
  go_router: ^14.6.2

  # UI & Animations
  flutter_animate: ^4.5.0
  lottie: ^3.1.3
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  photo_view: ^0.15.0
  flutter_slidable: ^3.1.1

  # Networking
  dio: ^5.7.0
  connectivity_plus: ^6.1.2

  # Storage
  shared_preferences: ^2.3.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Firebase
  firebase_core: ^3.8.1
  firebase_auth: ^5.3.4
  firebase_database: ^11.2.0
  firebase_messaging: ^15.2.0
  firebase_storage: ^12.3.7
  firebase_crashlytics: ^4.3.0
  firebase_analytics: ^11.3.6

  # Auth
  google_sign_in: ^6.2.2

  # Media
  image_picker: ^1.1.2
  file_picker: ^8.1.4
  record: ^5.1.2
  audioplayers: ^6.1.0
  video_player: ^2.9.2

  # Communication
  web_socket_channel: ^3.0.1

  # Utils
  uuid: ^4.5.1
  intl: ^0.19.0
  timeago: ^3.7.0
  url_launcher: ^6.3.1
  permission_handler: ^11.3.1
  path_provider: ^2.1.5
  path: ^1.9.0
  flutter_local_notifications: ^18.0.1
  emoji_picker_flutter: ^4.3.0
  crypto: ^3.0.5

  # Icons
  cupertino_icons: ^1.0.8
  phosphor_flutter: ^2.1.0

  # DI
  get_it: ^8.0.3

  # Encryption
  cryptography: ^2.7.0
  pointycastle: ^3.9.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
